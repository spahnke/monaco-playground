<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; form-action 'none'; object-src 'none'; base-uri 'none'" />
	<title>Monaco Playground</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="lib/monaco-editor/index.css">
	<script src="app.js" type="module"></script>
</head>
<body>
	<main>
		<div id="textInput"></div>
		<div id="debugRemoteAddressInput"></div>
		<div class="editorContainer">
			<div class="editor"></div>
		</div>
		<div class="statusBar"><span id="zoom"></span><span id="cursor"></span></div>
	</main>
	<aside>
		<label for="callframeList">
			Callstack:
			<select id="callframeList" size="2" disabled></select>
		</label>
		<label for="scriptList">
			Loaded Scripts:
			<select id="scriptList" size="2" disabled></select>
		</label>
	</aside>
</body>
</html>
